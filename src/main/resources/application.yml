spring:
  application:
    name: invest-calc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:investcalc}
    username: ${DB_USER:invest}
    password: ${DB_PASSWORD:invest}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

marketdata:
  provider: moex   # moex | mock
  connect-timeout-ms: 5000
  read-timeout-ms: 30000
  retry:
    max-attempts: 3
    backoff-ms: 500
  scheduler:
    enabled: true
    cron: "0 0 23 * * *"
    lookback-days: 30

server:
  port: 8080

logging:
  level:
    com.example.investcalc: INFO

spring.flyway.validate-on-migrate: false